name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # GitHub topics are a repository setting, not part of this tree.
          ignore: topics

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  card:
    name: Lovelace card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, typecheck, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
      - name: Built card is committed and self-contained
        run: |
          git diff --exit-code -- custom_components/tesla_logger/www/tesla-logger-card.js
          if grep -E "from ['\"](lit|leaflet)['\"]" custom_components/tesla_logger/www/tesla-logger-card.js; then
            echo "Card bundle still imports lit or leaflet"
            exit 1
          fi
