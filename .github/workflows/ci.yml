name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # GitHub topics are a repository setting, not part of this tree.
          ignore: topics

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  card:
    name: Lovelace card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify the vendored console UI
        working-directory: frontend
        run: node scripts/verify-ui.mjs
      - name: Install, lint, typecheck, and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Built card is committed and self-contained
        run: |
          git diff --exit-code -- custom_components/tesla_logger/www
          if grep -E "from ['\"](lit|leaflet|@jcollonville/tesla-logger-ui)['\"]" custom_components/tesla_logger/www/*.js; then
            echo "Card bundle still imports a runtime package"
            exit 1
          fi
          if grep -E "tile\\.openstreetmap|openfreemap\\.org" custom_components/tesla_logger/www/*.js; then
            echo "Card bundle still names a third-party tile host"
            exit 1
          fi
          python3 - <<'PY'
          import re
          from pathlib import Path
          www = Path("custom_components/tesla_logger/www")
          loader = (www / "tesla-logger-card.js").read_text(encoding="utf-8")
          if len(loader.encode()) > 30_000:
              raise SystemExit(f"loader is too large: {len(loader.encode())} bytes")
          if not re.search(r"""import\(\s*["']\./[^"']+\.js\?v=""", loader):
              raise SystemExit("loader is missing a relative versioned chunk import")
          scripts = list(www.glob("*.js"))
          if "maplibre" in loader:
              raise SystemExit("loader imports MapLibre; it must stay in the lazy chunk")
          maplibre = [path for path in scripts if path.name.startswith("maplibre-") and "worker" not in path.name]
          if len(maplibre) != 1:
              raise SystemExit(f"expected one MapLibre chunk, found {[path.name for path in maplibre]}")
          worker = www / "maplibre-gl-csp-worker.js"
          if not worker.is_file():
              raise SystemExit("MapLibre worker is missing")
          license_text = (www / "maplibre-gl-LICENSE.txt").read_text(encoding="utf-8")
          if "BSD" not in license_text:
              raise SystemExit("MapLibre license file is missing")
          ui = [path for path in scripts if path.name.startswith("tesla-logger-ui-")]
          if len(ui) != 1:
              raise SystemExit(f"expected one console UI chunk, found {[path.name for path in ui]}")
          if "tl-vehicle-card" not in ui[0].read_text(encoding="utf-8"):
              raise SystemExit("console UI chunk is missing tl-vehicle-card")
          for script in scripts:
              text = script.read_text(encoding="utf-8")
              if "leaflet" in text or "openfreemap.org" in text or "tile.openstreetmap.org" in text:
                  raise SystemExit(f"{script.name} still names a third-party tile host")
              for suffix in (".gz", ".br"):
                  sibling = Path(str(script) + suffix)
                  if not sibling.is_file() or sibling.stat().st_size >= script.stat().st_size:
                      raise SystemExit(f"missing smaller precompressed sibling for {script.name}")
          PY
