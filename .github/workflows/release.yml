name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare manifest version with the previous main commit
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python3 << 'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          manifest_path = "custom_components/tesla_logger/manifest.json"
          version = json.loads(Path(manifest_path).read_text(encoding="utf-8"))["version"]
          if (
              not isinstance(version, str)
              or not version
              or version.startswith("v")
              or any(char in version for char in " \t\r\n/\\")
          ):
              raise SystemExit(f"Refusing to release invalid version {version!r}")

          before = os.environ.get("BEFORE", "")
          changed = False
          if not before or set(before) == {"0"}:
              changed = True
          else:
              previous = subprocess.run(
                  ["git", "show", f"{before}:{manifest_path}"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if previous.returncode != 0:
                  missing = "does not exist" in previous.stderr or "but not in" in previous.stderr
                  if not missing:
                      raise SystemExit(previous.stderr or f"git show failed ({previous.returncode})")
                  changed = True
              else:
                  old = json.loads(previous.stdout)["version"]
                  changed = old != version

          tag = f"v{version}"
          remote = subprocess.run(
              ["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}"],
              capture_output=True,
              text=True,
              check=True,
          )
          tag_exists = bool(remote.stdout.strip())
          print(f"version={version} changed={changed} tag_exists={tag_exists}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"version={version}\n")
              handle.write(f"tag={tag}\n")
              handle.write(f"changed={'true' if changed else 'false'}\n")
              handle.write(f"tag_exists={'true' if tag_exists else 'false'}\n")
          PY

      - name: Create GitHub Release
        if: steps.plan.outputs.changed == 'true' && steps.plan.outputs.tag_exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.plan.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.plan.outputs.tag }}" \
            --generate-notes
